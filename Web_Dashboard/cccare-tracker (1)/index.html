<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · CCCARE exercise tracking</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <span class="brand">CCCARE <span class="brand-sub">exercise tracking</span></span>
  </header>

  <main class="signin">
    <h1>Sign in</h1>

    <div class="roles" role="group" aria-label="Sign in as">
      <button type="button" class="role" data-role="instructor" aria-pressed="false" aria-controls="signin">Instructor</button>
      <button type="button" class="role" data-role="patient" aria-pressed="false" aria-controls="signin">Patient</button>
    </div>

    <form class="signin-form" id="signin" novalidate hidden>
      <h2 id="form-title">Instructor sign-in</h2>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="form-error" id="error" role="alert"></p>
      <button class="btn" type="submit">Sign in</button>
    </form>

    <p class="signin-note mono" id="already" hidden></p>
  </main>

  <footer class="foot mono">
    <p>Sample accounts: instructor InsU / InsP, patient PatU / PatP.</p>
  </footer>

  <script src="js/util.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/score.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pages/signin.js"></script>
</body>
</html>
